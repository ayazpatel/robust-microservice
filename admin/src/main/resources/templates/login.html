<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>CEO Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- CDN first -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Local (optional, when you add files under static) -->
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <style>
        body { background: #f6f8fa; }
        .card { max-width: 420px; margin: 10vh auto; }
    </style>
</head>
<body>
<div class="container">
    <div class="card shadow-sm">
        <div class="card-body">
            <h1 class="h4 mb-3">CEO Login</h1>

            <div th:if="${param.error}" class="alert alert-danger">Invalid username or password</div>
            <div th:if="${param.logout}" class="alert alert-success">You have been logged out</div>

            <form th:action="@{/login}" method="post" class="needs-validation" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input id="username" name="username" type="text" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input id="password" name="password" type="password" class="form-control" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Sign in</button>
                <p class="text-muted small mt-2 mb-0">Access restricted to CEO role</p>
            </form>
        </div>
    </div>
</div>
<!-- CDN first -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<!-- Local (optional) -->
<script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
