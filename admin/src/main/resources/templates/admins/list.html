<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admins</title>
    <!-- CDN first -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Local (optional) -->
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <style>
        body { background: #fff; }
        .container { max-width: 1200px; }
        .table thead th { background: #f8f9fa; }
    </style>
</head>
<body>
<nav class="navbar navbar-light bg-light border-bottom mb-3">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">Admin Panel</span>
        <div class="d-flex gap-2">
            <a class="btn btn-primary" th:href="@{/admins/new}">New Admin</a>
            <a class="btn btn-outline-secondary" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>
<div class="container my-4">
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Admin ID</th>
                        <th>Username</th>
                        <th>App</th>
                        <th>Status</th>
                        <th>Plan</th>
                        <th>Expires</th>
                        <th>2FA</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="a : ${admins}">
                        <td><code th:text="${a.adminId}"></code></td>
                        <td th:text="${a.username}"></td>
                        <td th:text="${a.assignedAppId}"></td>
                        <td>
                            <span class="badge" th:classappend="${a.status.name()=='ACTIVE'}? 'text-bg-success' : (${a.status.name()=='BLOCKED'}? 'text-bg-danger' : 'text-bg-secondary')"
                                  th:text="${a.status}"></span>
                        </td>
                        <td th:text="${a.expiryPlan}"></td>
                        <td th:text="${a.expiresAt}"></td>
                        <td>
                            <span th:if="${a.twoFactorEnabled}" class="badge text-bg-primary">ON</span>
                            <span th:if="${!a.twoFactorEnabled}" class="badge text-bg-light text-dark">OFF</span>
                        </td>
                        <td class="text-nowrap">
                            <a class="btn btn-sm btn-outline-primary" th:href="@{'/admins/' + ${a.adminId} + '/edit'}">Edit</a>
                            <form th:action="@{'/admins/' + ${a.adminId} + '/delete'}" method="post" class="d-inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button class="btn btn-sm btn-outline-danger" type="submit" onclick="return confirm('Delete this admin?')">Delete</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(admins)}">
                        <td colspan="8" class="text-center text-muted py-4">No admins yet.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<!-- CDN first -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<!-- Local (optional) -->
<script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
