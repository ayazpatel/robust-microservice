<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${mode == 'create'} ? 'New Admin' : 'Edit Admin'"></title>
    <!-- CDN first -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Local (optional) -->
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <style>
        body { background: #fff; }
        .container { max-width: 900px; }
        .card { border: 1px solid #eef0f2; }
    </style>
</head>
<body>
<nav class="navbar navbar-light bg-light border-bottom mb-3">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/admins}">Admin Panel</a>
        <div class="d-flex"><a class="btn btn-outline-secondary btn-sm" th:href="@{/logout}">Logout</a></div>
    </div>
    </nav>
<div class="container my-4">
    <div class="card shadow-sm">
        <div class="card-body">
            <h3 class="card-title mb-3" th:text="${mode == 'create'} ? 'Create Admin' : 'Edit Admin'"></h3>

            <form th:action="${mode == 'create'} ? @{/admins} : @{'/admins/' + ${admin.adminId}}" method="post" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="username">Username</label>
                        <input id="username" class="form-control" name="username" type="text" th:value="${admin.username}" required>
                    </div>
                    <div class="col-md-6" th:if="${mode == 'edit'}">
                        <label class="form-label">Admin ID</label>
                        <input class="form-control" type="text" th:value="${admin.adminId}" readonly>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="password" th:text="${mode == 'create'} ? 'Password' : 'Password (leave blank to keep)'"></label>
                        <input id="password" class="form-control" name="password" type="password" th:placeholder="${mode == 'create'} ? 'Minimum 8 characters' : 'Optional'">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="assignedAppId">Assign App</label>
                        <select id="assignedAppId" class="form-select" name="assignedAppId">
                            <option value="" th:selected="${admin.assignedAppId == null}">None</option>
                            <option th:each="app : ${apps}" th:value="${app.appId}" th:text="${app.appName} + ' (' + ${app.appId} + ')'" th:selected="${admin.assignedAppId == app.appId}"></option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="expiryPlan">Expiry Plan</label>
                        <select id="expiryPlan" class="form-select" name="expiryPlan">
                            <option th:each="p : ${plans}" th:value="${p}" th:text="${p}" th:selected="${admin.expiryPlan == p}"></option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Two-step via Telegram Bot</label>
                        <div class="form-text">Two-step is always ON. Set your Telegram user ID to receive OTPs.</div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="telegramUserId">Telegram User ID</label>
                        <input id="telegramUserId" class="form-control" name="telegramUserId" type="text" th:value="${admin.telegramUserId}" placeholder="123456789">
                        <div class="form-text">Send <code>/start</code> to your bot and use the user ID shown.</div>
                    </div>

                    <div class="col-md-4" th:if="${mode == 'edit'}">
                        <label class="form-label" for="status">Status</label>
                        <select id="status" class="form-select" name="status">
                            <option th:value="${T(com.admin.model.Admin.AdminStatus).INACTIVE}" th:selected="${admin.status.name()=='INACTIVE'}">INACTIVE</option>
                            <option th:value="${T(com.admin.model.Admin.AdminStatus).ACTIVE}" th:selected="${admin.status.name()=='ACTIVE'}">ACTIVE</option>
                            <option th:value="${T(com.admin.model.Admin.AdminStatus).BLOCKED}" th:selected="${admin.status.name()=='BLOCKED'}">BLOCKED</option>
                        </select>
                        <div class="form-text">Once active, cannot go back to inactive; use Block to disable access.</div>
                    </div>

                    <div class="col-md-4" th:if="${mode == 'edit'}">
                        <label class="form-label" for="activatedAt">Activated At</label>
                        <input id="activatedAt" class="form-control" type="text" th:value="${admin.activatedAt}" readonly>
                    </div>
                    <div class="col-md-4" th:if="${mode == 'edit'}">
                        <label class="form-label" for="expiresAt">Expires At</label>
                        <input id="expiresAt" class="form-control" type="text" th:value="${admin.expiresAt}" readonly>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button class="btn btn-primary" type="submit" th:text="${mode == 'create'} ? 'Create' : 'Save Changes'"></button>
                    <a class="btn btn-outline-secondary" th:href="@{/admins}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
<!-- CDN first -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<!-- Local (optional) -->
<script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
