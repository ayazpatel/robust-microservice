spring:
  application:
    name: gateway-service
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8083

app:
  rabbit:
    exchange: ws_ingress
    queue: gateway.ws_ingress
    routing: "#"
  service:
    exchange: service.events

logging:
  level:
    "app.gateway": INFO
    "app.gateway.ingress": INFO

