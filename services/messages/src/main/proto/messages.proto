syntax = "proto3";

package messages.v1;

option java_multiple_files = true;
option java_package = "app.service.grpc.messages";
option java_outer_classname = "MessagesProto";

// Messages gRPC API

message ListMessagesRequest {
  string admin_id = 1;     // required for auth context
  string device_id = 2;    // optional device filter
  string recipient = 3;    // optional recipient filter
  string status = 4;       // optional MessageStatus enum name
  string type = 5;         // optional MessageType enum name
  int64 from_ms = 6;       // optional from (epoch millis)
  int64 to_ms = 7;         // optional to (epoch millis)
  int32 page = 8;          // pagination page
  int32 size = 9;          // pagination size (1..200)
  string app_id = 10;      // optional appId filter
}

message MessageItem {
  string device_id = 1;
  string recipient = 2;
  string message_content = 3;
  string message_status = 4;
  string message_type = 5;
  int64 event_ts_ms = 6;
}

message ListMessagesResponse {
  repeated MessageItem items = 1;
  int32 page = 2;
  int32 size = 3;
  int32 count = 4;
}

service MessagesService {
  rpc ListMessages (ListMessagesRequest) returns (ListMessagesResponse);
}
