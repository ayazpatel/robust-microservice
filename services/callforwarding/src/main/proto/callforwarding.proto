syntax = "proto3";

package callforwarding.v1;

option java_multiple_files = true;
option java_package = "app.service.grpc.callforwarding";
option java_outer_classname = "CallForwardingProto";

// Call Forwarding gRPC API
// Provides listing of call forwarding rules per admin/device with optional filters.

message ListCallForwardRequest {
  string admin_id = 1;                 // required: admin identifier (from session)
  string device_id = 2;                // optional: filter by device
  optional int32 subscription_id = 3;  // optional: SIM subscription id
  string reason = 4;                   // optional: UNCONDITIONAL/BUSY/NO_REPLY/NOT_REACHABLE
  string service = 5;                  // optional: VOICE/VIDEO
  int32 page = 6;                      // pagination page (0-based)
  int32 size = 7;                      // pagination size (1..200)
  string app_id = 8;                   // app partition (from admin-gateway session)
}

message CallForwardRule {
  uint64 id = 1;
  string device_id = 2;
  int32 subscription_id = 3;
  int32 sim_slot_index = 4;
  string carrier_name = 5;
  string reason = 6;         // enum value name
  bool enabled = 7;
  string forward_to = 8;
  int32 timeout_seconds = 9;
  string service = 10;       // enum value name
  bool is_set_by_admin = 11;
  int64 collected_at_ms = 12; // epoch millis
}

message ListCallForwardResponse {
  repeated CallForwardRule items = 1;
  int32 page = 2;
  int32 size = 3;
  int32 count = 4;
}

service CallForwardingService {
  rpc ListCallForwardRules (ListCallForwardRequest) returns (ListCallForwardResponse);
}
